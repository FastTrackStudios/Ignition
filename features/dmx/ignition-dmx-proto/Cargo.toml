[package]
name = "ignition-dmx-proto"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The DMX wire contract: venue output config, the Sink trait, status"

# The leaf of the feature. Depends on no backend and no transport, so
# a consumer that only reads a venue's `"dmx"` block -- ignition-viz --
# links none of the networking.
[dependencies]
serde.workspace = true
serde_json.workspace = true

[lib]
name = "ignition_dmx_proto"
path = "src/lib.rs"

[lints]
workspace = true
