[package]
name = "ignition-pane"
description = "Lighting, an Architect extension: the show in 3D as a pane, drawn by the `ignition` program as a process view, following Studio's playback. Linked into Studio Architect, or run as a process extension (a development copy that shadows the linked one live)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
# The extension as a process (extension.toml's [entry]): what a
# development copy runs.
name = "ignition-pane"
path = "src/main.rs"
required-features = ["extension"]

[[bin]]
# The programming actions from a shell, with no app running.
name = "ignition-program"
path = "src/bin/program.rs"
required-features = ["extension"]

# No Bevy here: the renderer is the `ignition` program (apps/ignition).
[features]
# The extension by default: EXT_CLONE builds its process copy with a plain
# `cargo build --bin ignition-pane`.
default = ["extension"]
# The extension: its actions, settings and view, over the app's actions.
extension = ["dep:architect-extensions", "dep:architect-extensions-dioxus", "dep:dioxus", "dep:serde_json", "dep:futures-timer", "dep:ignition-session", "dep:ignition-show", "dep:session", "dep:crdt", "dep:architect", "dep:tokio", "dep:uuid", "dep:ignition-daw"]
# Its view as the GPU pane — linked into an app built with
# `architect-desktop/process-views` (Studio Architect). Without it (the
# process), the view opens the room in a window.
pane = [
    "extension",
    "dep:architect-process-view",
    "dep:ignition-viz",
    "dep:ignition-core",
    "dep:web-sys",
    "dep:js-sys",
    "dep:wasm-bindgen-futures",
    "dep:tracing",
]

[dependencies]
dioxus = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
futures-timer = { workspace = true, optional = true }
# A show's cue list in a session (src/session.rs): through the host's
# `fts.session`, followed from the session host's transport and clock.
ignition-session = { workspace = true, optional = true }
ignition-show = { workspace = true, optional = true }
session = { workspace = true, optional = true, features = ["service", "sync"] }
# A recital song's cues resolved against its Live set, and the set's tempo
# over the song, for the session (IGNITION_SESSION_SONG).
ignition-daw = { workspace = true, optional = true, features = ["ableton"] }
crdt = { git = "https://github.com/FastTrackStudios/architect", rev = "eaa969f150b4c558b4722c09e7cf619d9fa4bede", optional = true, features = ["vox"] }
architect = { git = "https://github.com/FastTrackStudios/architect", rev = "eaa969f150b4c558b4722c09e7cf619d9fa4bede", optional = true, features = ["vox", "connect"] }
uuid = { workspace = true, optional = true }

# Natively the room is the `ignition` program's GPU process view, and the
# session's presence is followed on a thread of its own with a runtime.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# A process copy is a guest of the app (src/main.rs).
architect-extensions = { workspace = true, optional = true, features = ["guest"] }
architect-extensions-dioxus = { workspace = true, optional = true, features = ["guest"] }
architect-process-view = { workspace = true, optional = true, features = ["host"] }
tokio = { workspace = true, optional = true }

# In a browser the room is Ignition's web renderer (`ignition_viz::run_web`,
# Bevy on WebGPU) in a canvas of the view's, and the session's presence is
# followed on the page's own tasks (`architect::platform`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Linked into the web app: its views are the app's, no guest.
architect-extensions = { workspace = true, optional = true, features = ["linked-core"] }
architect-extensions-dioxus = { workspace = true, optional = true }
ignition-viz = { workspace = true, optional = true, default-features = false, features = ["web-assets"] }
ignition-core = { workspace = true, optional = true }
architect = { git = "https://github.com/FastTrackStudios/architect", rev = "eaa969f150b4c558b4722c09e7cf619d9fa4bede", optional = true, features = ["vox", "connect", "platform"] }
tracing = { workspace = true, optional = true }
# A browser has no threads to park a timer on.
futures-timer = { workspace = true, optional = true, features = ["wasm-bindgen"] }
web-sys = { version = "0.3", optional = true, features = ["Document", "Element", "HtmlElement", "HtmlCanvasElement", "Node", "Window", "Navigator", "CssStyleDeclaration"] }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
# The browser's manifest (src/ext.rs `without_view`) is still TOML.
toml = "1"

[lints]
workspace = true
