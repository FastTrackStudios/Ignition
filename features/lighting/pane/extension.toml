effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"env\":{\"description\":\"An environment: a name under data/venues or a path; default the show's venue.\",\"type\":\"string\"},\"chan\":{\"description\":\"The fixture.\",\"type\":\"integer\"},\"universe\":{\"description\":\"Its universe.\",\"type\":\"integer\"},\"address\":{\"description\":\"Its first address, 1 to 512.\",\"type\":\"integer\"},\"patched\":{\"description\":\"Whether it is on the wire.\",\"type\":\"boolean\"},\"moves\":{\"description\":\"Several: [{chan, universe, address, patched?}].\",\"type\":\"array\"},\"force\":{\"description\":\"Write it even with conflicts.\",\"type\":\"boolean\"}}}"

[[actions]]
