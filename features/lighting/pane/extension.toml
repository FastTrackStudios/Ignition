params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"env\":{\"description\":\"An environment: a name under data/venues or a path; default the show's venue.\",\"type\":\"string\"},\"name\":{\"description\":\"The group.\",\"type\":\"string\"},\"chans\":{\"description\":\"Its channels, in order.\",\"type\":\"array\"},\"target\":{\"description\":\"Fixtures: a role or group name, a list of channels, or a selection (the file's own form, e.g. {\\\"Role\\\":\\\"Wash\\\"}).\"},\"add\":{\"description\":\"Add to the group instead of replacing it.\",\"type\":\"boolean\"},\"delete\":{\"description\":\"Remove the group.\",\"type\":\"boolean\"}},\"required\":[\"name\"]}"

[[actions]]
