# Lighting, an Architect extension (src/ext.rs). One Rust value
# (`ignition_pane::ext::Lighting`) runs it two ways, as Studio's other
# extensions do:
#   - linked into Studio Architect (on by default in Studio's
#     distribution): its view is the show in 3D, a process view
#     (architect#641) drawn by the `ignition` program on the GPU;
#   - as a process (src/main.rs, [entry]): a development or installed
#     copy loaded into the running app (`architect dev --extension
#     <folder>`) shadows the linked one live, `undev` gives it back. Its
#     room is the `room` view below (`kind = "process"`, architect#838),
#     drawn by the renderer in the package on Linux and macOS; its `show`
#     view is the room's controls.
# The renderer is swappable live too: `ignition.renderer` (or
# IGNITION_BIN) names the program the pane runs.
id = "ignition"
name = "Lighting"
version = "0.2.0"
kind = "process"
api = "0.1"
description = "The lighting show in 3D: the room, the rig and the cues, following Studio's playback. Pick the show, the camera and the clock; drag to orbit, right-drag to move, the wheel to come closer, the number keys for the room's camera presets."
authors = ["FastTrackStudios"]

[entry]
# The program: bin/ignition-pane in a package (`just lighting pane-dev`
# puts a build there).
path = "bin/ignition-pane"

[source]
git = "https://github.com/FastTrackStudios/Ignition"
rev = "main"
path = "features/lighting/pane"

# The show's cue list in a session, through its host (src/session.rs).
[uses]
"fts.session" = "^0.1"

[capabilities]
actions = ["EXT_VIEW_OPEN"]
effect = "mutating"
# The room's renderer, run from the package by the app's process-view pane
# (the `room` view below, architect#838): asked for, granted like any
# capability.
programs = ["bin/ignition"]

[[actions]]
id = "IGNITION_SHOW_OPEN"
name = "Lighting: show the room"
description = "Opens (or focuses) the room: the show in 3D, following the clock it is set to (a process copy's `room` view, a linked copy's pane)."
group = "Lighting"
effect = "mutating"

[[actions]]
id = "IGNITION_SHOW_PICK"
name = "Lighting: pick the show"
description = "The night the pane plays: `show`, a path to an `.ig-show` (empty: the recital's, the program's default). `live_set` (optional) names the Live set its songs are of."
group = "Lighting"
effect = "mutating"
params = '{"type":"object","properties":{"show":{"type":"string"},"live_set":{"type":"string"}},"required":["show"]}'

[[actions]]
id = "IGNITION_CAMERA_PICK"
name = "Lighting: pick the camera"
description = "The camera preset the pane opens on (`Wide`, or a preset of the room's cameras.json; empty: the room's first)."
group = "Lighting"
effect = "mutating"
params = '{"type":"object","properties":{"camera":{"type":"string"}},"required":["camera"]}'

[[actions]]
id = "IGNITION_CLOCK_PICK"
name = "Lighting: pick the clock"
description = "What the show follows: `studio` (Studio's playback, the running engine), `studio:<socket>`, `internal` (stands at the first song) or `midi:<port>` (Ableton's beat clock)."
group = "Lighting"
effect = "mutating"
params = '{"type":"object","properties":{"clock":{"type":"string"}},"required":["clock"]}'

[[actions]]
id = "IGNITION_POP_OUT"
name = "Lighting: pop out to a display"
description = "The room fullscreen on a display of its own (a projector, the stage monitor): Studio runs the renderer borderless fullscreen with the pane's show, camera and clock. `display` (optional) is the display's index, 0 the first; none: the one Studio is on. Popping out again replaces it."
group = "Lighting"
effect = "mutating"
params = '{"type":"object","properties":{"display":{"type":"integer","minimum":0}}}'

[[actions]]
id = "IGNITION_POP_IN"
name = "Lighting: pop back in"
description = "Closes the popped-out room (the pane keeps running)."
group = "Lighting"
effect = "mutating"

[[actions]]
id = "IGNITION_STATE"
name = "Lighting: what it runs"
description = "Which copy of Lighting this is (linked or a process), and the renderer, show, camera and clock its pane runs."
group = "Lighting"
effect = "read_only"

[[sections]]
id = "lighting"
title = "Lighting"
icon = "lightbulb"

[[sections.settings]]
key = "ignition.show"
title = "Show"
description = "An .ig-show to play; empty for the recital's."
control = "text"
default = ""

[[sections.settings]]
key = "ignition.live_set"
title = "Live set"
description = "The Ableton set the show's songs are of; empty for IGNITION_LIVE_SET."
control = "text"
default = ""

[[sections.settings]]
key = "ignition.camera"
title = "Camera"
description = "The preset the pane opens on."
control = "text"
default = "Wide"

[[sections.settings]]
key = "ignition.clock"
title = "Clock"
description = "studio, studio:<socket>, internal, midi:<port> or session:<url>#<doc>@<song> (IGNITION_SESSION_ROOM sets it)."
control = "text"
default = "studio"

[[sections.settings]]
key = "ignition.session"
title = "Session"
description = "The session the cue list view follows: <url>#<doc>@<lane> (IGNITION_SESSION_ROOM sets it)."
control = "text"
default = ""

[[sections.settings]]
key = "ignition.renderer"
title = "Renderer"
description = "The ignition program the pane runs; empty for IGNITION_BIN, else the one beside the app, else on PATH."
control = "text"
default = ""

[[sections.settings]]
key = "ignition.output"
title = "Drive the rig"
description = "Send the show to the lights (sACN and Art-Net, as the venue says) from the pane's renderer."
control = "switch"
default = false

[[views]]
id = "show"
title = "Lighting"
icon = "lightbulb"

# The room itself, drawn by the renderer in the package on its own GPU
# device (architect#838: `kind = "process"`). Any copy shows it, built in,
# installed or in development: nothing is compiled into the app. Its
# arguments name the extension's settings (`{{setting:<key>}}`): a pick
# changed on the settings page starts the renderer again with it; one
# left empty is left out (`--show=` is as if not given).
[[views]]
id = "cues"
title = "Lighting: cues"
icon = "list"

[[views]]
id = "room"
title = "Lighting: room"
icon = "box"
kind = "process"
program = "bin/ignition"
args = [
  "--process-view",
  "--clock={{setting:ignition.clock}}",
  "--set={{setting:ignition.live_set}}",
  "--show={{setting:ignition.show}}",
  "--camera={{setting:ignition.camera}}",
  "--output={{setting:ignition.output}}",
]

[[actions]]
id = "IGNITION_SESSION_STORE"
name = "Lighting: put the cue list in a session"
description = "Stores the cue list of a song's show document (`song`, a path) as lane `lane` of session `doc`, through the session's host (fts.session)."
group = "Lighting"
effect = "mutating"
params = '{"type":"object","properties":{"doc":{"type":"string"},"lane":{"type":"string"},"song":{"type":"string"}},"required":["doc","lane","song"]}'

[[actions]]
id = "IGNITION_SESSION_CUES"
name = "Lighting: the session's cue list"
description = "Lane `lane` of session `doc` read back through fts.session, in GO order: number, name, bar (null: the operator's)."
group = "Lighting"
effect = "read_only"
params = '{"type":"object","properties":{"doc":{"type":"string"},"lane":{"type":"string"}},"required":["doc","lane"]}'

[[actions]]
id = "IGNITION_SESSION_FOLLOW"
name = "Lighting: follow the session's transport"
description = "Follows the session host's transport and clock at `url` (`ws://host:port/vox`) and takes lane `lane`'s cues of session `doc` as the playhead crosses them."
group = "Lighting"
effect = "mutating"
params = '{"type":"object","properties":{"url":{"type":"string"},"doc":{"type":"string"},"lane":{"type":"string"}},"required":["url","doc","lane"]}'

[[actions]]
id = "IGNITION_SESSION_ROOM"
name = "Lighting: the room follows a session"
description = "The room plays the night's song `song` (slug or number) from session `doc`'s transport, hosted at `url` (`ws://host:port/vox`): the session read through fts.session, then the room's clock set to `session:<url>#<doc>@<song>`, and the cue list view (`cues`) to that session's lane `lane` (default `main`)."
group = "Lighting"
effect = "mutating"
params = '{"type":"object","properties":{"url":{"type":"string"},"doc":{"type":"string"},"song":{"type":"string"},"lane":{"type":"string"}},"required":["url","doc","song"]}'

[[actions]]
id = "IGNITION_SESSION_SONG"
name = "Lighting: a recital song into a session"
description = "Song `locator` of the Live set `live_set` into session `doc`: its cue list (`cues`, a song file with section-relative positions) resolved against the set as the night resolves it and stored as lane `lane`, and the set's tempo over the song made the session's tempo map, through fts.session; `bar_one` (optional, a bar of the song) is where the chart's bar 1 is, after a count-in; `tempo: false` leaves the session's tempo map and bar 1 to its host (the DAW engine) and places the cues on it."
group = "Lighting"
effect = "mutating"
params = '{"type":"object","properties":{"doc":{"type":"string"},"lane":{"type":"string"},"live_set":{"type":"string"},"locator":{"type":"string"},"cues":{"type":"string"},"bar_one":{"type":"integer","minimum":1},"tempo":{"type":"boolean"}},"required":["doc","lane","live_set","locator","cues"]}'

[[actions]]
id = "IGNITION_SESSION_TAKEN"
name = "Lighting: cues taken from the session"
description = "What the follower took (each cue and the session time it was taken at) and the clock estimate."
group = "Lighting"
effect = "read_only"

# >>> programming actions (tools/program_actions.py writes this from actions.json)

[[actions]]
id = "IGNITION_ACTIONS"
name = "Lighting: the programming actions"
description = "Every programming action with its arguments, as data (this catalogue)."
group = "Lighting"
effect = "read_only"

[[actions]]
id = "IGNITION_HISTORY"
name = "Lighting: edit history"
description = "The steps of the edit history (data/.history) and which is current."
group = "Lighting"
effect = "read_only"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"limit\":{\"description\":\"How many of the latest steps (default 50).\",\"type\":\"integer\"}}}"

[[actions]]
id = "IGNITION_UNDO"
name = "Lighting: undo the last edit"
description = "Puts every file the last step wrote back as it was."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"}}}"

[[actions]]
id = "IGNITION_REDO"
name = "Lighting: redo"
description = "Applies the step that was undone."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"}}}"

[[actions]]
id = "IGNITION_EDIT_BEGIN"
name = "Lighting: open an edit"
description = "Opens an edit: every programming action until IGNITION_EDIT_COMMIT is one history step (one undo). A Luau script opens one first."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"label\":{\"description\":\"What the step is called in the history.\",\"type\":\"string\"}}}"

[[actions]]
id = "IGNITION_EDIT_COMMIT"
name = "Lighting: commit the open edit"
description = "Closes the open edit as one history step."
group = "Lighting"
effect = "mutating"

[[actions]]
id = "IGNITION_EDIT_ABORT"
name = "Lighting: abort the open edit"
description = "Closes the open edit and puts every file it wrote back."
group = "Lighting"
effect = "mutating"

[[actions]]
id = "IGNITION_BATCH"
name = "Lighting: run several actions as one step"
description = "Runs `steps` ([{action, args}]) in order as one history step; if one fails, nothing of the batch is kept."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"steps\":{\"description\":\"[{action, args}], in order.\",\"type\":\"array\"},\"label\":{\"description\":\"The step's name in the history.\",\"type\":\"string\"}},\"required\":[\"steps\"]}"

[[actions]]
id = "IGNITION_LIBRARY_LIST"
name = "Lighting: list the library"
description = "What is in the library, by kind, each entry with the layer it comes from (song, set or profile), its tags and folder, and a one-line summary; and the palette in use with its slots as RGB."
group = "Lighting"
effect = "read_only"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"kind\":{\"description\":\"colors, palettes, splits, effects, looks, focus, beams or tricks.\",\"type\":\"string\"},\"tag\":{\"description\":\"Only entries with this tag.\",\"type\":\"string\"},\"folder\":{\"description\":\"Only entries in this folder (or under it).\",\"type\":\"string\"},\"family\":{\"description\":\"Effects of one family: intensity, movement, colour, beam, strip, matrix, one-shot.\",\"type\":\"string\"},\"search\":{\"description\":\"Only names or descriptions containing this.\",\"type\":\"string\"},\"layer\":{\"description\":\"Only entries whose top layer is song, set or profile.\",\"type\":\"string\"}}}"

[[actions]]
id = "IGNITION_LIBRARY_GET"
name = "Lighting: get a library entry"
description = "One entry in full, the layer it comes from and the layers it overrides."
group = "Lighting"
effect = "read_only"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"kind\":{\"description\":\"colors, palettes, splits, effects, looks, focus, beams or tricks.\",\"type\":\"string\"},\"name\":{\"description\":\"The entry.\",\"type\":\"string\"}},\"required\":[\"kind\",\"name\"]}"

[[actions]]
id = "IGNITION_LIBRARY_CREATE"
name = "Lighting: add to the library"
description = "Adds an entry. Shapes: colors {red,green,blue}; palettes {slots:{Primary: colour name or {red,green,blue}}}; splits {colors:[names], distribute: cycle|spread|block}; effects {recipe, family}; looks {recipes:[parts], kind}; focus {target:{x,y,z}}; beams {values:[[attribute, value]]}; tricks (see IGNITION_TRICKS_UNITS). Every entry takes about, tags, folder."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"kind\":{\"description\":\"colors, palettes, splits, effects, looks, focus, beams or tricks.\",\"type\":\"string\"},\"name\":{\"description\":\"Its name.\",\"type\":\"string\"},\"entry\":{\"description\":\"The entry.\",\"type\":\"object\"},\"scope\":{\"description\":\"Which layer is written: `set` (the set's library, the default) or `song` (that song's overrides; needs `song`).\",\"type\":\"string\"},\"replace\":{\"description\":\"Write over an entry of that name in the layer.\",\"type\":\"boolean\"}},\"required\":[\"kind\",\"name\",\"entry\"]}"

[[actions]]
id = "IGNITION_LIBRARY_UPDATE"
name = "Lighting: change a library entry"
description = "Merges `set` into an entry (a null removes a key). An entry that is only in a lower layer is copied up into the layer written: that is how a song overrides the set, and the set the profile."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"kind\":{\"description\":\"colors, palettes, splits, effects, looks, focus, beams or tricks.\",\"type\":\"string\"},\"name\":{\"description\":\"The entry.\",\"type\":\"string\"},\"set\":{\"description\":\"The keys to change.\",\"type\":\"object\"},\"scope\":{\"description\":\"Which layer is written: `set` (the set's library, the default) or `song` (that song's overrides; needs `song`).\",\"type\":\"string\"}},\"required\":[\"kind\",\"name\",\"set\"]}"

[[actions]]
id = "IGNITION_LIBRARY_DUPLICATE"
name = "Lighting: duplicate a library entry"
description = "Copies an entry (from any layer, the profile's included) under another name, with `set` merged in."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"kind\":{\"description\":\"colors, palettes, splits, effects, looks, focus, beams or tricks.\",\"type\":\"string\"},\"name\":{\"description\":\"The entry to copy.\",\"type\":\"string\"},\"as\":{\"description\":\"The copy's name.\",\"type\":\"string\"},\"set\":{\"description\":\"Keys to change in the copy.\",\"type\":\"object\"},\"scope\":{\"description\":\"Which layer is written: `set` (the set's library, the default) or `song` (that song's overrides; needs `song`).\",\"type\":\"string\"}},\"required\":[\"kind\",\"name\",\"as\"]}"

[[actions]]
id = "IGNITION_LIBRARY_DELETE"
name = "Lighting: delete a library entry"
description = "Removes an entry from the set's (or the song's) layer; says which lower layer's entry of that name now shows through. The profile's entries are read-only."
group = "Lighting"
effect = "destructive"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"kind\":{\"description\":\"colors, palettes, splits, effects, looks, focus, beams or tricks.\",\"type\":\"string\"},\"name\":{\"description\":\"The entry.\",\"type\":\"string\"},\"scope\":{\"description\":\"Which layer is written: `set` (the set's library, the default) or `song` (that song's overrides; needs `song`).\",\"type\":\"string\"}},\"required\":[\"kind\",\"name\"]}"

[[actions]]
id = "IGNITION_LIBRARY_USES"
name = "Lighting: where a library entry is used"
description = "The songs and cues of the show that name an entry."
group = "Lighting"
effect = "read_only"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"name\":{\"description\":\"The entry's name.\",\"type\":\"string\"}},\"required\":[\"name\"]}"

[[actions]]
id = "IGNITION_LIBRARY_TAGS"
name = "Lighting: the library's tags and folders"
description = "Every tag and folder in use."
group = "Lighting"
effect = "read_only"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"}}}"

[[actions]]
id = "IGNITION_PALETTE_USE"
name = "Lighting: use a palette"
description = "Names the palette in use: the set's, or with `song` that song's (an empty `palette` gives a song back the set's). Its slots become the colours cues name (Primary, Secondary…): this is the re-skin."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"palette\":{\"description\":\"The palette's name.\",\"type\":\"string\"}},\"required\":[\"palette\"]}"

[[actions]]
id = "IGNITION_EFFECT_MAKE"
name = "Lighting: make an effect"
description = "Writes an effect from parameters and saves it to the library: `what` moves, in a `shape`, once every `beats`, `depth` either side of where it is, spread across the target by `tricks` or `spread_deg`."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"name\":{\"description\":\"The effect's name.\",\"type\":\"string\"},\"target\":{\"description\":\"Fixtures: a role or group name, a list of channels, or a selection (the file's own form, e.g. {\\\"Role\\\":\\\"Wash\\\"}).\"},\"what\":{\"description\":\"dimmer, pan, tilt, circle, zoom, iris, focus, strobe or color.\",\"type\":\"string\"},\"shape\":{\"description\":\"sine, triangle, square (chase), ramp or ramp_down.\",\"type\":\"string\"},\"beats\":{\"description\":\"Beats per loop (default 4).\",\"type\":\"number\"},\"depth\":{\"description\":\"How far it swings, 0 to 1 (pan/tilt: degrees).\",\"type\":\"number\"},\"base\":{\"description\":\"Makes it absolute about this value instead of relative to the look.\",\"type\":\"number\"},\"colors\":{\"description\":\"For `what: color`: two or more colour or slot names.\",\"type\":\"array\"},\"spread_deg\":{\"description\":\"Phase spread across the units, degrees (360: a chase).\",\"type\":\"number\"},\"direction\":{\"description\":\"Forward, Reverse, Bounce, Build or Negative.\",\"type\":\"string\"},\"tricks\":{\"description\":\"Tricks: a trick preset's name, or its settings {tricks:[…], phase:{from,to}, phase_y, phase_z, speed:{from,to}, delay:{from,to}, fade:{from,to}, direction, grid}, or a bare chain [{\\\"Block\\\":2},{\\\"Wings\\\":2}].\"},\"speed\":{\"description\":\"The tempo source (default {\\\"Master\\\":\\\"Song\\\"}); {\\\"Bpm\\\":120}, {\\\"Hz\\\":2}.\"},\"once\":{\"description\":\"A one-shot: runs once and holds its last step.\",\"type\":\"boolean\"},\"family\":{\"description\":\"Its family, for the picker.\",\"type\":\"string\"},\"about\":{\"description\":\"One line for the picker.\",\"type\":\"string\"},\"tags\":{\"description\":\"Tags.\",\"type\":\"array\"},\"folder\":{\"description\":\"Folder.\",\"type\":\"string\"},\"scope\":{\"description\":\"Which layer is written: `set` (the set's library, the default) or `song` (that song's overrides; needs `song`).\",\"type\":\"string\"},\"replace\":{\"description\":\"Write over an effect of that name.\",\"type\":\"boolean\"},\"dry_run\":{\"description\":\"Answer the effect and save nothing.\",\"type\":\"boolean\"}},\"required\":[\"name\",\"target\"]}"

[[actions]]
id = "IGNITION_EFFECT_PREVIEW"
name = "Lighting: preview an effect"
description = "Runs an effect (`effect` by name, a `recipe`, or IGNITION_EFFECT_MAKE's parameters) on a target of an environment and answers what every fixture does at each sample of the loop. Saves nothing."
group = "Lighting"
effect = "read_only"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"env\":{\"description\":\"An environment: a name under data/venues or a path; default the show's venue.\",\"type\":\"string\"},\"effect\":{\"description\":\"A library effect.\",\"type\":\"string\"},\"recipe\":{\"description\":\"A recipe written in place.\",\"type\":\"object\"},\"target\":{\"description\":\"Fixtures: a role or group name, a list of channels, or a selection (the file's own form, e.g. {\\\"Role\\\":\\\"Wash\\\"}).\"},\"tricks\":{\"description\":\"Tricks: a trick preset's name, or its settings {tricks:[…], phase:{from,to}, phase_y, phase_z, speed:{from,to}, delay:{from,to}, fade:{from,to}, direction, grid}, or a bare chain [{\\\"Block\\\":2},{\\\"Wings\\\":2}].\"},\"bpm\":{\"description\":\"The tempo (default 120).\",\"type\":\"number\"},\"beats_shown\":{\"description\":\"How many beats to show (default one loop).\",\"type\":\"number\"},\"samples\":{\"description\":\"Samples across them (default 8, at most 64).\",\"type\":\"integer\"},\"what\":{\"description\":\"As IGNITION_EFFECT_MAKE.\",\"type\":\"string\"},\"shape\":{\"description\":\"As IGNITION_EFFECT_MAKE.\",\"type\":\"string\"},\"beats\":{\"description\":\"As IGNITION_EFFECT_MAKE.\",\"type\":\"number\"},\"depth\":{\"description\":\"As IGNITION_EFFECT_MAKE.\",\"type\":\"number\"},\"spread_deg\":{\"description\":\"As IGNITION_EFFECT_MAKE.\",\"type\":\"number\"}}}"

[[actions]]
id = "IGNITION_TRICKS_UNITS"
name = "Lighting: the units tricks make"
description = "Cuts a target into units with tricks and answers each unit's fixtures, its place on the selection grid (x along the selection, y across, z up, read from where the fixtures hang, or a preset's hand-made grid), and its phase, rate, delay and fade under the preset's spreads. With no `tricks`: the grid itself. `step` names one unit (wrapping): next and previous."
group = "Lighting"
effect = "read_only"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"env\":{\"description\":\"An environment: a name under data/venues or a path; default the show's venue.\",\"type\":\"string\"},\"target\":{\"description\":\"Fixtures: a role or group name, a list of channels, or a selection (the file's own form, e.g. {\\\"Role\\\":\\\"Wash\\\"}).\"},\"tricks\":{\"description\":\"Tricks: a trick preset's name, or its settings {tricks:[…], phase:{from,to}, phase_y, phase_z, speed:{from,to}, delay:{from,to}, fade:{from,to}, direction, grid}, or a bare chain [{\\\"Block\\\":2},{\\\"Wings\\\":2}].\"},\"step\":{\"description\":\"Which unit to answer as `step` (wraps; negative counts back).\",\"type\":\"integer\"}},\"required\":[\"target\"]}"

[[actions]]
id = "IGNITION_TRICKS_APPLY"
name = "Lighting: put tricks on a cue's effects"
description = "Puts a trick preset on a cue's effect parts (those of `target`, or the one named `effect`): its tricks, phase, speed and direction go on the part, its delay and fade become the cue's fan. A part that names a library effect becomes that effect written in place."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"cue\":{\"description\":\"The cue's name.\",\"type\":\"string\"},\"target\":{\"description\":\"Fixtures: a role or group name, a list of channels, or a selection (the file's own form, e.g. {\\\"Role\\\":\\\"Wash\\\"}).\"},\"effect\":{\"description\":\"Only the part of this effect or name.\",\"type\":\"string\"},\"tricks\":{\"description\":\"Tricks: a trick preset's name, or its settings {tricks:[…], phase:{from,to}, phase_y, phase_z, speed:{from,to}, delay:{from,to}, fade:{from,to}, direction, grid}, or a bare chain [{\\\"Block\\\":2},{\\\"Wings\\\":2}].\"},\"statics\":{\"description\":\"Also put the tricks on static parts.\",\"type\":\"boolean\"}},\"required\":[\"song\",\"cue\",\"tricks\"]}"

[[actions]]
id = "IGNITION_SONG_LIST"
name = "Lighting: the show's songs"
description = "Every song of the show: title, set, file, counts of cues, triggers, sections and markers, and its palette."
group = "Lighting"
effect = "read_only"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"}}}"

[[actions]]
id = "IGNITION_SONG_GET"
name = "Lighting: a song's show"
description = "A song: its sections (with the cue that opens each), its markers by kind, every cue with its position and parts, its palette's slots and what it overrides."
group = "Lighting"
effect = "read_only"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"markers\":{\"description\":\"List every marker instead of counting them by kind.\",\"type\":\"boolean\"}},\"required\":[\"song\"]}"

[[actions]]
id = "IGNITION_SONG_CREATE"
name = "Lighting: add a song"
description = "Adds a song to the show with an empty cue list (and the show file, when there is none yet)."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"env\":{\"description\":\"An environment: a name under data/venues or a path; default the show's venue.\",\"type\":\"string\"},\"title\":{\"description\":\"The song's title.\",\"type\":\"string\"},\"locator\":{\"description\":\"Its locator in the Live set (default the title).\",\"type\":\"string\"},\"set\":{\"description\":\"Which set of the night.\",\"type\":\"string\"},\"sections\":{\"description\":\"Its section map: [{name, bars, bar?}].\",\"type\":\"array\"},\"file\":{\"description\":\"Its file, relative to the show (default ../songs/<show>/<slug>.json).\",\"type\":\"string\"}},\"required\":[\"title\"]}"

[[actions]]
id = "IGNITION_SONG_MAP_SET"
name = "Lighting: set a song's sections and markers"
description = "Sets the song's section map ([{name, bars, bar?}]) and adds markers ([{name?, kind, bar, beat, strength?}]: kick, snare, a stop), then resolves every cue's bar again."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"sections\":{\"description\":\"[{name, bars, bar?}], in order.\",\"type\":\"array\"},\"markers\":{\"description\":\"[{name?, kind, bar, beat, strength?}].\",\"type\":\"array\"},\"replace_markers\":{\"description\":\"Drop the markers there first.\",\"type\":\"boolean\"}},\"required\":[\"song\"]}"

[[actions]]
id = "IGNITION_SONG_MAP_IMPORT"
