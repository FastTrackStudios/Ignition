effect = "destructive"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"env\":{\"description\":\"An environment: a name under data/venues or a path; default the show's venue.\",\"type\":\"string\"},\"chan\":{\"description\":\"One fixture.\",\"type\":\"integer\"},\"chans\":{\"description\":\"Several.\",\"type\":\"array\"},\"target\":{\"description\":\"Fixtures: a role or group name, a list of channels, or a selection (the file's own form, e.g. {\\\"Role\\\":\\\"Wash\\\"}).\"}}}"

[[actions]]
