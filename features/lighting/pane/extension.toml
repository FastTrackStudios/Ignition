group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"env\":{\"description\":\"An environment: a name under data/venues or a path; default the show's venue.\",\"type\":\"string\"},\"type\":{\"description\":\"A fixture type (IGNITION_FIXTURE_TYPES).\",\"type\":\"string\"},\"mode\":{\"description\":\"Its mode (default its first).\",\"type\":\"string\"},\"name\":{\"description\":\"Their name (numbered when several).\",\"type\":\"string\"},\"count\":{\"description\":\"How many (default 1).\",\"type\":\"integer\"},\"position\":{\"description\":\"{x, y, z} metres: the first one.\",\"type\":\"object\"},\"step\":{\"description\":\"{x, y, z}: from each to the next.\",\"type\":\"object\"},\"aim\":{\"description\":\"{x, y, z}: a point each one's beam points at, at rest (the hang is worked out; with none they hang pointing straight down).\",\"type\":\"object\"},\"eulers\":{\"description\":\"{x, y, z} degrees: the hang as rotations instead.\",\"type\":\"object\"},\"quat\":{\"description\":\"{w, x, y, z}: the hang as a quaternion instead.\",\"type\":\"object\"},\"tags\":{\"description\":\"Tags.\",\"type\":\"array\"},\"groups\":{\"description\":\"Groups they join (made if missing).\",\"type\":\"array\"},\"universe\":{\"description\":\"Default 1.\",\"type\":\"integer\"},\"address\":{\"description\":\"The first address (default the next free).\",\"type\":\"integer\"},\"chan\":{\"description\":\"The first channel (default the next free).\",\"type\":\"integer\"}},\"required\":[\"type\",\"position\"]}"

[[actions]]
id = "IGNITION_FIXTURE_SET"
name = "Lighting: move, turn or change fixtures"
description = "Changes fixtures (`chan`, `chans` or a `target`): `position` places, `move` shifts, `aim` (a point the beam points at, at rest), `eulers` or `quat` re-hangs, `mode` and `type` change what they are on the wire, `name`, `label`, `tags`. Answers the patch problems the change leaves."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"env\":{\"description\":\"An environment: a name under data/venues or a path; default the show's venue.\",\"type\":\"string\"},\"chan\":{\"description\":\"One fixture.\",\"type\":\"integer\"},\"chans\":{\"description\":\"Several.\",\"type\":\"array\"},\"target\":{\"description\":\"Fixtures: a role or group name, a list of channels, or a selection (the file's own form, e.g. {\\\"Role\\\":\\\"Wash\\\"}).\"},\"position\":{\"description\":\"{x, y, z}.\",\"type\":\"object\"},\"move\":{\"description\":\"{x, y, z}: shift by this.\",\"type\":\"object\"},\"aim\":{\"description\":\"{x, y, z}: re-hang so the beam points here at rest.\",\"type\":\"object\"},\"eulers\":{\"description\":\"{x, y, z} degrees.\",\"type\":\"object\"},\"quat\":{\"description\":\"{w, x, y, z}.\",\"type\":\"object\"},\"mode\":{\"description\":\"A mode of its type.\",\"type\":\"string\"},\"type\":{\"description\":\"Another fixture type.\",\"type\":\"string\"},\"name\":{\"description\":\"Name.\",\"type\":\"string\"},\"label\":{\"description\":\"The operator's own word for it.\",\"type\":\"string\"},\"tags\":{\"description\":\"Tags.\",\"type\":\"array\"}}}"

[[actions]]
id = "IGNITION_FIXTURE_REMOVE"
