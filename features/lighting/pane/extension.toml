description = "Reads every song's sections from the Live set (its locator's range) into the song files and resolves the cues again."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"live_set\":{\"description\":\"The .als (default IGNITION_LIVE_SET).\",\"type\":\"string\"},\"song\":{\"description\":\"Only this song.\",\"type\":\"string\"}}}"

[[actions]]
id = "IGNITION_SONG_SLOTS"
name = "Lighting: a song's colours as palette slots"
description = "Makes the colours a song's cues name into slots (White, Primary, Secondary, Tertiary, Accent…, by use), adds a palette of the song's name holding them to the set's library, and points the cues at the slots. The look is unchanged; another palette now re-skins it."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"}},\"required\":[\"song\"]}"

[[actions]]
id = "IGNITION_SONG_BAKE"
name = "Lighting: a song with its library written in"
description = "Writes a copy of a song's cue list with nothing left to look up in the library: slot and library colours as values, the library's effects and looks in place, its focus points as points. For a player that does not read the library (the viz tool, a session lane, a copy sent elsewhere). The song's file is not changed."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"to\":{\"description\":\"Where the copy goes.\",\"type\":\"string\"}},\"required\":[\"song\",\"to\"]}"

[[actions]]
id = "IGNITION_CUE_GET"
