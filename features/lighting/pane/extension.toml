group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"cue\":{\"description\":\"Its name, its number, or {index}.\"},\"at\":{\"description\":\"Where: a bar (12), \\\"bar.beat\\\" (\\\"12.3\\\"), a section (\\\"Chorus 1\\\", \\\"Chorus 1+2\\\" two bars in, \\\"Chorus 1#2\\\" its second occurrence), {marker: name}, or the file's own form.\"},\"set\":{\"description\":\"Keys to change.\",\"type\":\"object\"},\"parts\":{\"description\":\"What the cue gets: one part or a list. A part is {target, dimmer?, color? (a colour or palette slot), split?, focus? (a focus point's name or {x,y,z}), beam?, raw?} for a static part, {target, effect, bars?, depth?, tricks?, name?} for an effect, or {look}. `clear: true` drops the target's other parts first.\"},\"remove\":{\"description\":\"{target?, effect?, look?}: the parts to take off.\",\"type\":\"object\"}},\"required\":[\"song\",\"cue\"]}"

[[actions]]
