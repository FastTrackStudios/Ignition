group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"env\":{\"description\":\"An environment: a name under data/venues or a path; default the show's venue.\",\"type\":\"string\"},\"target\":{\"description\":\"Fixtures: a role or group name, a list of channels, or a selection (the file's own form, e.g. {\\\"Role\\\":\\\"Wash\\\"}).\"},\"person\":{\"description\":\"A person of the environment.\",\"type\":\"string\"},\"focus\":{\"description\":\"A focus point or focus role.\",\"type\":\"string\"},\"point\":{\"description\":\"{x, y, z} metres.\",\"type\":\"object\"},\"song\":{\"description\":\"Write the focus into this song.\",\"type\":\"string\"},\"section\":{\"description\":\"On this section's cue.\",\"type\":\"string\"},\"cue\":{\"description\":\"Or on this cue.\",\"type\":\"string\"},\"dimmer\":{\"description\":\"A level for the part too.\",\"type\":\"number\"}},\"required\":[\"target\"]}"

[[actions]]
