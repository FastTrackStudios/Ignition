group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"Move the room's people there too.\",\"type\":\"boolean\"},\"env\":{\"description\":\"An environment: a name under data/venues or a path; default the show's venue.\",\"type\":\"string\"},\"song\":{\"description\":\"The song.\",\"type\":\"string\"},\"section\":{\"description\":\"A section, or * for the whole song.\",\"type\":\"string\"},\"positions\":{\"description\":\"{person: {x, y, z?, facing_deg?}}.\",\"type\":\"object\"}},\"required\":[\"song\"]}"

[[actions]]
