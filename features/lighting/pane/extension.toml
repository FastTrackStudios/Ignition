effect = "destructive"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"cue\":{\"description\":\"Its name, its number, or {index}.\"}},\"required\":[\"song\",\"cue\"]}"

[[actions]]
id = "IGNITION_SECTION_APPLY"
name = "Lighting: put a look on sections"
