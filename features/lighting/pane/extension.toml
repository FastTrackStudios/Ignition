effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"from\":{\"description\":\"The section copied.\",\"type\":\"string\"},\"to\":{\"description\":\"The sections written: a name, \\\"kind:chorus\\\", \\\"*\\\" or a list.\"},\"to_song\":{\"description\":\"Another song of the show.\",\"type\":\"string\"}},\"required\":[\"song\",\"from\",\"to\"]}"

[[actions]]
id = "IGNITION_FILL_SECTIONS"
name = "Lighting: a look per section"
description = "Fills from the section map: `looks` maps a section's kind (intro, verse, pre, chorus, bridge, solo, break, outro, other, or *) or its name to the parts it gets. Answers the plan section by section; `dry_run` writes nothing."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"looks\":{\"description\":\"{kind or section name: parts}.\",\"type\":\"object\"},\"replace\":{\"description\":\"Empty each section's cue first.\",\"type\":\"boolean\"},\"block\":{\"description\":\"Set every section cue's block.\",\"type\":\"boolean\"},\"dry_run\":{\"description\":\"Answer the plan and write nothing.\",\"type\":\"boolean\"}},\"required\":[\"song\",\"looks\"]}"

[[actions]]
id = "IGNITION_FILL_HITS"
name = "Lighting: accents on hits"
description = "Adds a trigger (a one-shot bump on `target`) at every marker of a `kind`, or every hit of a `hits` file (a band, above a strength). Answers what it would add; `dry_run` writes nothing."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"target\":{\"description\":\"Fixtures: a role or group name, a list of channels, or a selection (the file's own form, e.g. {\\\"Role\\\":\\\"Wash\\\"}).\"},\"kind\":{\"description\":\"The markers' kind (kick, snare…).\",\"type\":\"string\"},\"hits\":{\"description\":\"A hits file instead of markers (as data/songs/bye-bye-bye.hits.json).\",\"type\":\"string\"},\"band\":{\"description\":\"With `hits`: Low, Mid or High.\",\"type\":\"string\"},\"min_strength\":{\"description\":\"Only hits at least this strong.\",\"type\":\"number\"},\"section\":{\"description\":\"Only inside these sections.\"},\"bump\":{\"description\":\"Level, White, ColorBoost or Burst (default Level).\",\"type\":\"string\"},\"depth\":{\"description\":\"How hard, 0 to 1 (default 0.6).\",\"type\":\"number\"},\"name\":{\"description\":\"The triggers' name prefix (default the kind).\",\"type\":\"string\"},\"replace\":{\"description\":\"Drop the triggers of that name first.\",\"type\":\"boolean\"},\"dry_run\":{\"description\":\"Answer the plan and write nothing.\",\"type\":\"boolean\"}},\"required\":[\"song\",\"target\"]}"

[[actions]]
