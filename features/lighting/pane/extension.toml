params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"env\":{\"description\":\"An environment: a name under data/venues or a path; default the show's venue.\",\"type\":\"string\"},\"name\":{\"description\":\"The point.\",\"type\":\"string\"},\"target\":{\"description\":\"{x, y, z} metres.\",\"type\":\"object\"},\"remove\":{\"description\":\"Delete it.\",\"type\":\"boolean\"}},\"required\":[\"name\"]}"

[[actions]]
