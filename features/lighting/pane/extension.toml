group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"song\":{\"description\":\"A song of the show: its title, locator or slug, or a path to its file.\",\"type\":\"string\"},\"section\":{\"description\":\"A section name, \\\"Chorus 1#2\\\", \\\"kind:chorus\\\" (verse, pre, chorus, bridge, solo, break, intro, outro), \\\"*\\\", or a list.\"},\"parts\":{\"description\":\"What the cue gets: one part or a list. A part is {target, dimmer?, color? (a colour or palette slot), split?, focus? (a focus point's name or {x,y,z}), beam?, raw?} for a static part, {target, effect, bars?, depth?, tricks?, name?} for an effect, or {look}. `clear: true` drops the target's other parts first.\"}},\"required\":[\"song\",\"section\",\"parts\"]}"

[[actions]]
id = "IGNITION_SECTION_COPY"
name = "Lighting: copy a section's look"
description = "Copies the look of a section's cue (its parts, fade and timing) onto other sections, of the same song or of `to_song`."
