[[actions]]
id = "IGNITION_ENV_GET"
name = "Lighting: an environment"
description = "One environment: its room (floor, walls, audience), props (truss, risers, people), screens, people, groups, role bindings, focus points and where its universes go; and, for a measured room (environment.json), its dimensions, every object of its model (kind, position, turn, shown, movable) and its own light groups."
group = "Lighting"
effect = "read_only"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"env\":{\"description\":\"An environment: a name under data/venues or a path; default the show's venue.\",\"type\":\"string\"}}}"

[[actions]]
id = "IGNITION_ENV_CREATE"
name = "Lighting: make an environment"
description = "A room from its dimensions (metres): a floor and four walls, and when asked a stage riser, an audience area and trusses. Empty of fixtures; seven focus points and the Wide and Top cameras come with it."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"name\":{\"description\":\"Its name (the folder is its slug).\",\"type\":\"string\"},\"title\":{\"description\":\"What it is called.\",\"type\":\"string\"},\"width\":{\"description\":\"Across, metres.\",\"type\":\"number\"},\"depth\":{\"description\":\"Front to back, metres.\",\"type\":\"number\"},\"height\":{\"description\":\"Metres (default 4).\",\"type\":\"number\"},\"upstage\":{\"description\":\"How far the upstage wall is behind the origin (default a fifth of the depth).\",\"type\":\"number\"},\"stage\":{\"description\":\"{width, depth, height, y}: a riser.\",\"type\":\"object\"},\"audience\":{\"description\":\"{depth, width, front}: the audience area.\",\"type\":\"object\"},\"truss\":{\"description\":\"[{name, x, y, z, width, turn}].\",\"type\":\"array\"}},\"required\":[\"name\",\"width\",\"depth\"]}"

[[actions]]
id = "IGNITION_ENV_DUPLICATE"
