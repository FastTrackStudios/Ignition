group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"env\":{\"description\":\"An environment: a name under data/venues or a path; default the show's venue.\",\"type\":\"string\"},\"group\":{\"description\":\"A light group (house…).\",\"type\":\"string\"},\"on\":{\"description\":\"Whether it starts on.\",\"type\":\"boolean\"}}}"

[[actions]]
id = "IGNITION_PERSON_SET"
name = "Lighting: place or move a person"
description = "Places a performer or stand-in (or several, `people`): position on the floor, facing, height, a label such as the instrument; `move` shifts by {x, y, z}. Each is a prop the visualizer draws and a focus point at head height under their name."
group = "Lighting"
effect = "mutating"
params = "{\"type\":\"object\",\"properties\":{\"root\":{\"description\":\"The lighting data root (the folder holding data/); default IGNITION_ROOT.\",\"type\":\"string\"},\"show\":{\"description\":\"The show: a path to an .ig-show or a name under data/shows; default IGNITION_SHOW, else the recital.\",\"type\":\"string\"},\"env\":{\"description\":\"An environment: a name under data/venues or a path; default the show's venue.\",\"type\":\"string\"},\"name\":{\"description\":\"Who.\",\"type\":\"string\"},\"label\":{\"description\":\"Their instrument or part.\",\"type\":\"string\"},\"position\":{\"description\":\"{x, y, z} metres.\",\"type\":\"object\"},\"facing_deg\":{\"description\":\"Which way they face, degrees (0: downstage).\",\"type\":\"number\"},\"height\":{\"description\":\"Metres (default 1.75).\",\"type\":\"number\"},\"stand_in\":{\"description\":\"A stand-in rather than the performer.\",\"type\":\"boolean\"},\"move\":{\"description\":\"{x, y, z}: shift by this.\",\"type\":\"object\"},\"people\":{\"description\":\"Several at once: a list of the same keys.\",\"type\":\"array\"}}}"

[[actions]]
id = "IGNITION_PERSON_REMOVE"
