# Ignition — one root workspace.
#
# The lighting engine as an Architect extension, in its own repo. The
# crates are the port that lived in Studio as `features/lighting` and
# `apps/ignition` (studio 8bfa77ea, branch save/recital-worktree-2026-11-17)
# and keep that layout. Everything Ignition still takes from Studio is in
# the "Studio crates" block of `[workspace.dependencies]` below; that block
# is the list of what stands between Ignition and not needing Studio.
[workspace]
resolver = "3"

members = [
    # ── lighting (docs/lighting; features/lighting/README.md) ──
    "features/lighting/proto",
    "features/lighting/daw-proto",
    "features/lighting/colour",
    "features/lighting/rig",
    "features/lighting/show",
    "features/lighting/effects",
    "features/lighting/playback",
    "features/lighting/core",
    "features/lighting/dmx",
    "features/lighting/daw",
    "features/lighting/fixture",
    "features/lighting/profile",
    "features/lighting/viz",
    # Cue lists in a session (the session primitive).
    "features/lighting/session",
    # The Architect extension (id `ignition`, extension.toml).
    "features/lighting/pane",
    # The renderer the extension starts (`--process-view`), and tooling.
    "apps/ignition",
    "apps/ignition-engine",
    "apps/ignition-mobile",
    "apps/ignition-live-web",
    "crates/ignition-live-ui",
]

# Not ported; kept as they were at 196e159. See legacy/README.md. The two
# forks in vendor/ are patched in below and are not members, as in Studio.
exclude = ["legacy", "vendor"]

[workspace.package]
# The extension's version (features/lighting/pane/extension.toml).
version = "0.2.0"
license = "GPL-3.0-or-later"
edition = "2024"
# Bevy 0.19's own MSRV. The compiler is rust-toolchain.toml's.
rust-version = "1.95"
authors = ["FastTrack Studio"]
repository = "https://github.com/FastTrackStudios/Ignition"

[workspace.dependencies]
# ── lighting: features/lighting ──
ignition-proto = { path = "features/lighting/proto" }
ignition-daw-proto = { path = "features/lighting/daw-proto" }
ignition-colour = { path = "features/lighting/colour" }
ignition-rig = { path = "features/lighting/rig" }
ignition-show = { path = "features/lighting/show" }
ignition-session = { path = "features/lighting/session" }
# The session primitive (FastTrackStudios/session): cue lists as its lanes
# and items (features/lighting/session). By rev until it is tagged.
session = { git = "https://github.com/FastTrackStudios/session", rev = "a8ec37a454c767c0558973412c4d321746066d02", default-features = false }
ignition-effects = { path = "features/lighting/effects" }
ignition-playback = { path = "features/lighting/playback" }
ignition-core = { path = "features/lighting/core" }
ignition-dmx = { path = "features/lighting/dmx" }
ignition-daw = { path = "features/lighting/daw" }
ignition-fixture = { path = "features/lighting/fixture" }
ignition-profile = { path = "features/lighting/profile" }
ignition-viz = { path = "features/lighting/viz" }
ignition-pane = { path = "features/lighting/pane" }

# ── Studio crates ─────────────────────────────────────────────────────
# Everything Ignition takes from github.com/FastTrackStudios/studio, at
# the commit the port was saved at (8bfa77ea, branch
# save/recital-worktree-2026-11-17). One revision for all of them: they
# are one workspace there and resolve against each other. Each entry says
# what Ignition uses it for; removing an entry is a step towards Ignition
# not needing Studio.
#
# `utils::paths::checkout_path` only: where the checkout's data is
# (features/lighting, its GDTF library, the visualizer's assets). Used by
# ignition-fixture, ignition-viz and apps/ignition.
utils = { git = "https://github.com/FastTrackStudios/studio", rev = "8bfa77ea4efdd98322e848fb53d95ee554d419d1" }
# Reading an Ableton Live set (`read_live_set`, `setlist`, `tempo`): the
# songs of a night and their tempo maps. ignition-daw's `ableton` feature
# (on by default), and apps/ignition's tests.
ableton = { git = "https://github.com/FastTrackStudios/studio", rev = "8bfa77ea4efdd98322e848fb53d95ee554d419d1" }
# `dsp::hits::detect` (feature `hits`): drum hits found in a stem, for
# ignition-daw's `hits` (cues on the hits).
dsp = { git = "https://github.com/FastTrackStudios/studio", rev = "8bfa77ea4efdd98322e848fb53d95ee554d419d1" }
# The REAPER project parser (`parse_rpp_file`, `ReaperProject`, MIDI
# items): ignition-daw's `reaper` and `chart`.
dawfile-reaper = { git = "https://github.com/FastTrackStudios/studio", rev = "8bfa77ea4efdd98322e848fb53d95ee554d419d1" }
# The DAW's wire types (`ProjectContext`, the `Transport` service, play
# state): ignition-daw's `play` feature.
daw-proto = { git = "https://github.com/FastTrackStudios/studio", rev = "8bfa77ea4efdd98322e848fb53d95ee554d419d1" }
# `daw_control::Daw`, the client of Studio's running engine: apps/ignition
# follows Studio's playback with it (`--clock studio`, studio_clock.rs).
daw-control = { git = "https://github.com/FastTrackStudios/studio", rev = "8bfa77ea4efdd98322e848fb53d95ee554d419d1" }
# The DAW facade. ignition-daw's `play` feature plays a REAPER project on
# its standalone engine (`daw::standalone`, feature `standalone-rpp`), so
# a song can be heard while its cues are written.
daw = { git = "https://github.com/FastTrackStudios/studio", rev = "8bfa77ea4efdd98322e848fb53d95ee554d419d1" }
# `audio::io::AudioIoPrefs`: the output device for that playback
# (ignition-daw's `play` feature).
audio = { git = "https://github.com/FastTrackStudios/studio", rev = "8bfa77ea4efdd98322e848fb53d95ee554d419d1" }
# Decoding a stem to mono samples (`load_mono_f32`), for hit detection in
# ignition-daw. Defaults off, as at Studio's root; ignition-daw asks for
# `decode-compressed`.
fts-sample = { git = "https://github.com/FastTrackStudios/studio", rev = "8bfa77ea4efdd98322e848fb53d95ee554d419d1", default-features = false }

# Not Studio's, but Studio's pin: the LRC lyrics parser
# (`keyflow_proto::lrc`), for ignition-daw's `lyrics`.
keyflow-proto = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.5.4" }

# ── Architect — the same source Studio's root pins at that commit ─────
# One tag shared by every entry so the framework moves together.
# The extension API: ignition-pane links into an Architect build
# (`linked`) and runs as a process extension (`guest`).
architect-extensions = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.14.0" }
# View input and theme tokens (`ViewInput`, `Button`, `ThemeTokens`) the
# process view receives.
architect-workspace = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.14.0" }
# Process views (architect#641): a pane drawn by another program over a
# socket pair, its frames in shared memory or a dma-buf — the visualizer's
# pane (apps/ignition --process-view), by the tag the rest of architect is.
architect-process-view = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.14.0" }

architect-telemetry = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.14.0", features = ["otel"] }
ignition-live-ui = { path = "crates/ignition-live-ui" }
ignition-mobile = { path = "apps/ignition-mobile" }

# ── UI framework ──────────────────────────────────────────────────────
# dioxus 0.8 line — git rev pinned: DioxusLabs/dioxus main 430cfb56
# (0.8.0-alpha.3), architect v0.12.6's. Only ignition-pane takes it (the
# extension's view when it runs as a process).
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", default-features = false, features = ["lib"] }

# ── RPC to Studio's engine (apps/ignition, studio_clock.rs) ───────────
vox = { version = "0.10.0-rc.5", default-features = false, features = ["runtime"] }
vox-stream = { version = "0.10.0-rc.5" }

# ── External, at Studio's versions ────────────────────────────────────
tokio = { version = "1.48", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-timer = "3"
# Hardware MIDI I/O — 0.11 to share one alsa-sys across the stack.
midir = "0.11"
cpal = "0.18"

# Bevy and wgpu are not here: ignition-viz and apps/ignition name them
# themselves (`bevy = "0.19.1"`, `wgpu = "29"`), because Bevy 0.19 is on
# wgpu 29 while Architect's Blitz is on wgpu 30. That is why the pane is
# a process view (another program, its own GPU device).

[patch.crates-io]
# The visualizer's two one-hunk forks (features/lighting/viz):
# gdtf 0.3.0 (vendor/gdtf/FTS-PATCH.md) and bevy_pbr 0.19.1, so a light
# can scatter in volumetric fog without casting a shadow
# (vendor/bevy_pbr/FTS-PATCH.md, docs/lighting/domain/beams-in-the-air.md).
gdtf = { path = "vendor/gdtf" }
bevy_pbr = { path = "vendor/bevy_pbr" }

# ── Studio's patches ──────────────────────────────────────────────────
# A git dependency's [patch] does not reach its consumers, so the entries
# of Studio's root [patch] tables (at 8bfa77ea) that this graph uses are
# repeated here, with Studio's pins. They go with the Studio and
# Architect crates above. Left out because nothing in this graph takes
# them: tone3000, baseview, editor-lsp, editor-crdt.
# Vendored one-line fix: parse_schema_bytes rejected every real schema
# exchange with "schema decode consumed N of M bytes".
vox-phon = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.3.0" }
# pipewire-rs one commit past v0.10.0: PipeWire 1.6's cast-form constants
# need the clang macro fallback's build dir.
libspa-sys = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs.git", rev = "9b54509e848e53ffa971ace15d7adf4908c09358" }
pipewire-sys = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs.git", rev = "9b54509e848e53ffa971ace15d7adf4908c09358" }
# Blitz from the FTS fork, at the revision Architect's pin names
# (`fix/accessibility-unstyled`, 8009ce15: a resize and the accessibility
# tree pass elements never styled). One revision across all blitz
# crates, and anyrender from the same one.
blitz-dom = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "8009ce1572aee1c7f4fbed25856189e5e79da4fb" }
blitz-traits = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "8009ce1572aee1c7f4fbed25856189e5e79da4fb" }
blitz-paint = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "8009ce1572aee1c7f4fbed25856189e5e79da4fb" }
blitz-shell = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "8009ce1572aee1c7f4fbed25856189e5e79da4fb" }
blitz-net = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "8009ce1572aee1c7f4fbed25856189e5e79da4fb" }
blitz-html = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "8009ce1572aee1c7f4fbed25856189e5e79da4fb" }
anyrender = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "8009ce1572aee1c7f4fbed25856189e5e79da4fb" }
anyrender_vello = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
anyrender_vello_hybrid = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
winit-uikit = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
wgpu-hal = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
raw-window-metal = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
# Quote scalars containing `<`/`>`.
styx-format = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.1.0" }
# phon rc.7 + derive support for parse/display opaque scalars; facet-core
# rc.7 keeping sub-second precision; phon-jit forced to the stable stencils.
phon = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.4.1" }
facet-core = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.4.1" }
phon-jit = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.2.3" }

# The FTS forks of dioxus-native, dioxus-native-dom and dioxus-vdom
# (vendor v0.7.1 = architect's v0.7.0 + DioxusLabs/dioxus#5668's fix).
[patch."https://github.com/DioxusLabs/dioxus"]
dioxus-native = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
dioxus-native-dom = { git = "https://www.github.com/FastTrackStudios/vendor", rev = "25bf4bcdfd0b6acb268ca91a93bc8ff8da683a96" }
dioxus-vdom = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }

# keyflow (a git dependency) still takes daw, dawfile-reaper and fts-sample
# from daw's old repo; this gives it Studio's copies, so there is one of
# each. Paths in Studio; here the same crates from Studio's repo.
[patch."https://github.com/FastTrackStudios/daw"]
daw = { git = "https://github.com/FastTrackStudios/studio", rev = "8bfa77ea4efdd98322e848fb53d95ee554d419d1" }
dawfile-reaper = { git = "https://github.com/FastTrackStudios/studio", rev = "8bfa77ea4efdd98322e848fb53d95ee554d419d1" }
fts-sample = { git = "https://github.com/FastTrackStudios/studio", rev = "8bfa77ea4efdd98322e848fb53d95ee554d419d1" }

# One Architect: `session` (the session primitive) takes architect and
# crdt at tag v0.12.6, which would put a second Architect in the graph,
# and with it blitz db5b7ef (whose window resize panics). Every Architect
# crate is at the root's pin (above); the same revision on the `www.`
# host, which cargo counts as another source, is how a git dependency's
# own pin is overridden. Move it with that pin.
[patch."https://github.com/FastTrackStudios/architect"]
architect = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.14.0" }
architect-action-derive = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.14.0" }
architect-derive = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.14.0" }
architect-devices = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.14.0" }
architect-orgs = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.14.0" }
architect-permissions = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.14.0" }
architect-rpc-derive = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.14.0" }
architect-workspace-hack = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.14.0" }
crdt = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.14.0" }
crdt-derive = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.14.0" }

# One editor source: architect v0.12.6's workspace-hack names the editor
# on the `www.` host while its other crates name the plain one.
[patch."https://github.com/FastTrackStudios/editor"]
editor-ext = { git = "https://www.github.com/FastTrackStudios/editor", rev = "6817dc2c709fbb5a7858229592bbbc85eed49528" }
editor-state = { git = "https://www.github.com/FastTrackStudios/editor", rev = "6817dc2c709fbb5a7858229592bbbc85eed49528" }
editor-syntax = { git = "https://www.github.com/FastTrackStudios/editor", rev = "6817dc2c709fbb5a7858229592bbbc85eed49528" }
editor-view = { git = "https://www.github.com/FastTrackStudios/editor", rev = "6817dc2c709fbb5a7858229592bbbc85eed49528" }
editor-vim = { git = "https://www.github.com/FastTrackStudios/editor", rev = "6817dc2c709fbb5a7858229592bbbc85eed49528" }

# ── Lints ─────────────────────────────────────────────────────────────
# The rust and rustdoc tables are Studio's, which the port was written
# under; the clippy table was already the same in both repos.
[workspace.lints.rust]
dead_code = "warn"
unused = "warn"
unused_unsafe = "warn"
# architect's attribute macros emit `#[cfg_attr(feature = "fake", ...)]`
# into the calling crate; declare the name so those crates don't warn.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("fake"))'] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"

# `deny`, not `warn`: this tree went from 0 to 55 warnings without
# anyone noticing, and a gate nothing has to pass is not a gate. The
# panic set below is the load-bearing half — a desk that unwraps its
# way into a `None` at bar 43 takes the room dark, and there is no
# operator recovery from a process that is gone. Where a lint genuinely
# cannot be satisfied, the escape is a scoped `#[expect(..., reason =
# "…")]` naming why, never a line removed from here.
#
# Tests lift the panic lints via `clippy.toml`.
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# No path from a mistake to a dark room.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Dependencies at full optimisation even in dev. Bevy, wgpu and the
# volumetric pass are all in the dependency graph, and unoptimised they
# run the visualizer at a handful of frames a second. The workspace
# crates keep the dev profile above, so a rebuild of our own code stays
# fast.
[profile.dev.package."*"]
opt-level = 3

# The profile the Justfile's recipes build with (Studio's name for it, so
# a renderer built here and an Architect built there share kache's
# entries). It is the dev profile, nothing else.
[profile.desktop-dev]
inherits = "dev"
