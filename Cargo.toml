# Ignition — one root workspace, matching FastTrackStudio's convention.
[workspace]
resolver = "3"

members = [
    "crates/bevy-pbr-vendored",
    "crates/gdtf-vendored",
    "crates/dioxus-native-vendored",
    "crates/anyrender-vello-vendored",
    "crates/blitz-dom-vendored",
    "crates/ignition-proto",
    "crates/ignition-core",
    # features/ — one capability per directory, backends beside the
    # facade. See docs/domain/DOMAIN.md; the shape is architect's.
    "features/dmx/ignition-dmx-proto",
    "features/dmx/ignition-dmx-sacn",
    "features/dmx/ignition-dmx-artnet",
    "features/dmx/ignition-dmx",
    "features/colour/ignition-colour",
    "features/rig/ignition-rig",
    "features/show/ignition-show",
    "features/effects/ignition-effects",
    "features/playback/ignition-playback",
    "features/daw/ignition-daw-proto",
    "features/daw/ignition-daw-reaper",
    "features/daw/ignition-daw-transport",
    "features/daw/ignition-daw",
    "crates/ignition-profile",
    "crates/ignition-viz",
    "crates/ignition-live-ui",
    "apps/ignition-engine",
    "apps/ignition-studio",
    "apps/ignition-live-web",
    "apps/ignition-mobile",
]

[workspace.package]
license = "GPL-3.0-or-later"
edition = "2024"
# Bevy 0.19's own MSRV — see `flake.nix`, which is where a toolchain
# that new comes from.
rust-version = "1.95"
repository = "https://github.com/FastTrackStudios/Ignition"

[workspace.dependencies]
ignition-proto = { path = "crates/ignition-proto" }
ignition-core = { path = "crates/ignition-core" }
ignition-profile = { path = "crates/ignition-profile" }
ignition-daw = { path = "features/daw/ignition-daw" }
ignition-viz = { path = "crates/ignition-viz" }
ignition-dmx-proto = { path = "features/dmx/ignition-dmx-proto" }
ignition-dmx-sacn = { path = "features/dmx/ignition-dmx-sacn" }
ignition-dmx-artnet = { path = "features/dmx/ignition-dmx-artnet" }
ignition-dmx = { path = "features/dmx/ignition-dmx" }
ignition-colour = { path = "features/colour/ignition-colour" }
ignition-rig = { path = "features/rig/ignition-rig" }
ignition-show = { path = "features/show/ignition-show" }
ignition-effects = { path = "features/effects/ignition-effects" }
ignition-playback = { path = "features/playback/ignition-playback" }
ignition-daw-proto = { path = "features/daw/ignition-daw-proto" }
ignition-daw-transport = { path = "features/daw/ignition-daw-transport" }
ignition-daw-reaper = { path = "features/daw/ignition-daw-reaper" }
ignition-live-ui = { path = "crates/ignition-live-ui" }

# The DAW domain, from the `daw` repo.
#
# A **tagged git dep**, not a sibling path, and this is not negotiable:
# `../daw/...` only resolves when the two repos happen to sit side by
# side on one disk, so CI — which checks out ONE repo — could not run
# `cargo metadata` on this workspace at all, let alone build it.
#
# The pull the other way is real and worth naming, because it is what
# put a path here in the first place: the end goal is lighting as a
# sub-project *inside* a DAW project, the two trees are edited together,
# and a version pin describes that badly. The answer is to move the tag
# often, not to point at a directory. `features/daw/ignition-daw` takes
# `daw-proto`, `daw-audio-io`, `keyflow-proto` and `fts-sample` from the
# same tag, and `hit-detect-dsp` from `signal` at its own — all six move
# together or not at all.
#
# `file` is the only feature on: it brings `daw::file` (the RPP/`.daw`
# parser) and nothing else. Transport and playback arrive with
# `standalone-*` when there is a clock to drive.
daw = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.3", default-features = false, features = [
    "file",
] }

serde = { version = "1", features = ["derive"] }

# Shared with Bevy 0.19.1 (which pins ^29.0.3) and with the Dioxus 0.8
# line's Blitz renderer. That they agree is what makes embedding the
# visualizer in a Dioxus window possible at all — one `Device` type, one
# texture, no cross-device copy. See crates/ignition-viz/src/embedded.rs.
wgpu = "29"
serde_json = "1"

# The visualizer's engine. `default-features = false` drops the 2D and
# audio stacks; `3d` pulls the render / PBR / post-process / picking set,
# and the camera-controller features are the operator's fly-around.
#
# Bevy re-exports `glam` as `bevy::math`, which is the tree's only glam —
# crates here take their vector types from Bevy rather than depending on
# glam directly, so there is never a second incompatible copy of `Vec3`
# to convert across.
#
# 0.19 needs Rust 1.95; `flake.nix` is what supplies it (the ambient
# FastTrackStudio toolchain is 1.94). Build through `nix develop`.
bevy = { version = "0.19.1", default-features = false, features = [
    "3d",
    # The CDN serves this venue's screen content as WebP regardless of the
    # extension it is requested under, and neither WebP nor JPEG is in the
    # default image set.
    "webp",
    "jpeg",
    # The operator overlay: cue name, cooked status, show clock. Not in
    # the `3d` set, which is renderer-only.
    "bevy_ui",
    "bevy_ui_render",
    "bevy_text",
    "default_font",
    # Clustered decals: the gobo projector (`crates/ignition-viz/src/gobo.rs`).
    "pbr_clustered_decals",
    "bevy_camera_controller",
    "free_camera",
    "pan_camera",
    "multi_threaded",
    "x11",
    "wayland",
] }
# Dioxus for the iOS app. Pinned to the SAME git rev the sibling FTS repos
# use -- the `dx` CLI in the devshell is 0.8.0-alpha.0 and refuses to build
# against a mismatched dioxus, so this rev moves in lockstep with them.
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false, features = ["lib"] }
ignition-mobile = { path = "apps/ignition-mobile" }

# Telemetry -- Ignition's ONLY dependency on architect, taken deliberately
# narrow: just the telemetry feature crate, not the framework. Traces, logs
# and metrics go to the FTS collector so the lighting app is observable
# alongside the other products. `otel` is inert unless the build bakes
# TASK_OTLP_ENDPOINT, so a dev build ships no telemetry at all.
#
# Pinned to a tag like every cross-repo dep here. If Ignition later takes a
# wider architect dependency, that one must use this SAME tag -- a split tag
# means two copies of the architect crates whose traits refuse to unify.
architect-telemetry = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.5.0", features = ["otel"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Vendored fork — see crates/gdtf-vendored/PATCH-NOTES.md. Redirects every
# `gdtf = "0.3.0"` dependency (currently just ignition-viz) to the local
# patched copy without touching any import paths.
[patch.crates-io]
gdtf = { path = "crates/gdtf-vendored" }
# Vendored, one-hunk patch: one wgpu instance and device pool for every
# Blitz window in the process — see crates/anyrender-vello-vendored/NOTICE.md.
anyrender_vello = { path = "crates/anyrender-vello-vendored" }
# Vendored `bevy_pbr`, one hunk: a light may scatter in volumetric fog
# without casting a shadow. Upstream ties the two together, which for a
# lighting visualiser means only the eight fixtures that can afford a
# shadow map appear in the haze — see crates/bevy-pbr-vendored/NOTICE.md
# and docs/domain/beams-in-the-air.md.
bevy_pbr = { path = "crates/bevy-pbr-vendored" }
# Vendored: text-selection endpoints are cleared when the node they point at
# is removed, and the document-order walk no longer panics on a detached
# node (studio crash in traversal.rs `compare_document_order`) — see
# crates/blitz-dom-vendored/NOTICE.md.
blitz-dom = { path = "crates/blitz-dom-vendored" }

# Vendored `packages/native` from the pinned dioxus revision, with
# runtime multi-window (`NewWindow` / `open_window`) added — see
# crates/dioxus-native-vendored/NOTICE.md. r[impl studio.windows.implementation]
[patch."https://github.com/DioxusLabs/dioxus"]
dioxus-native = { path = "crates/dioxus-native-vendored" }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Dependencies at full optimisation even in dev. Bevy, wgpu and the
# volumetric pass are all in the dependency graph, and unoptimised they
# run the studio at a handful of frames a second — `just studio-dev`
# was unusable for judging anything about motion. The workspace crates
# keep the dev profile above, so a rebuild of our own code stays fast.
[profile.dev.package."*"]
opt-level = 3
