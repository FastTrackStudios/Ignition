# Ignition — one root workspace, matching FastTrackStudio's convention.
[workspace]
resolver = "3"

members = [
    "crates/gdtf-vendored",
    "crates/ignition-proto",
    "crates/ignition-core",
    "crates/ignition-viz",
    "apps/ignition-engine",
]

[workspace.package]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.87"
repository = "https://github.com/FastTrackStudios/Ignition"

[workspace.dependencies]
ignition-proto = { path = "crates/ignition-proto" }
ignition-core = { path = "crates/ignition-core" }
ignition-viz = { path = "crates/ignition-viz" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Vendored fork — see crates/gdtf-vendored/PATCH-NOTES.md. Redirects every
# `gdtf = "0.3.0"` dependency (currently just ignition-viz) to the local
# patched copy without touching any import paths.
[patch.crates-io]
gdtf = { path = "crates/gdtf-vendored" }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
