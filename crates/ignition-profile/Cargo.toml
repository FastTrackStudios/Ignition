[package]
name = "ignition-profile"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# Where the frame went.
#
# No optional features and no external profiler: this is a
# `tracing_subscriber::Layer`, so it sees every span any crate in the
# process already emits — ours, Bevy's (with `ignition-viz/trace`),
# Blitz's — without any of them depending on this crate. Spans are the
# wire protocol.

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
