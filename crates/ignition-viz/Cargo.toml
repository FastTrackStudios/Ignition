[package]
name = "ignition-viz"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

# Which video codecs the screen canvases can play. Neither is required:
# with both off, every canvas is a still and nothing else changes.
[features]
# HAP is on by default because it costs almost nothing to have — three
# small pure-Rust crates, no system library — and it is the codec this
# corner of the industry actually runs (Resolume, VDMX, every media
# server ships it). See src/video/hap.rs for why the format suits a
# scrubbable show.
default = ["hap"]
hap = ["dep:hap-qt", "dep:texpresso"]
# Everything else — h.264 in mp4, WebM. Off by default because it links
# libav*, so `pkgs.ffmpeg` has to be in the dev shell and in whatever
# builds a release. See src/video/ffmpeg.rs.
ffmpeg = ["dep:ffmpeg-next"]
# Spike: Bevy Solari, real-time raytraced direct lighting in place of
# the shadow-map budget. Needs a device with ray-query support (see
# src/solari.rs for what it does and does not buy). Off by default.
solari = ["bevy/bevy_solari"]
# Bevy's own instrumentation: a span per system, per schedule and per
# render pass, which `IGNITION_PROFILE=all` then aggregates. Off by
# default because the spans cost something even unread, and the stage
# table answers the usual question without them.
# `bevy/debug` is what puts the system's *name* in its span. Without it
# every row in an `IGNITION_PROFILE=all` table reads "<Enable the debug
# feature to see the name>", which is a table of one row.
trace = ["bevy/trace", "bevy/debug"]

[dependencies]
anyhow = "1.0.104"
bevy.workspace = true
wgpu.workspace = true
tracing = "0.1"
# The bench runs with no host and no Bevy `LogPlugin` (the embedded path
# disables it, since a host owns the subscriber), so it installs one itself.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gdtf = "0.3.0"
# Reads a GLB's header — the accessor bounds — so a fixture part can be
# sized before Bevy's own glTF loader has drawn it. Same version that
# loader already pulls in, so it costs no extra crate in the tree.
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }
# The `gdtf://` asset source (src/gdtf_assets.rs) serves a profile's
# model files straight out of its zip to Bevy's glTF loader. Same
# version and features as the vendored `gdtf` crate, so it is one copy.
zip = { version = "8.6", features = ["deflate"], default-features = false }
ignition-core.workspace = true
ignition-dmx.workspace = true
ignition-proto.workspace = true
ignition-fixture.workspace = true
# Held at 0.25.6 because blitz-dom (via the studio app) pins that
# version exactly, and two copies of `image` in one tree is a silent
# duplicate rather than an error. Bevy only needs 0.25.2.
image = { version = "0.25.6", default-features = false, features = ["png"] }
# The host pointer's stable `PointerId::Custom` — see `picking.rs`.
uuid = "1"
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0.20"

# --- video, both optional; see [features] above ---
# QuickTime demux plus HAP frame parsing, pure Rust. Its default
# `cpu-compression` feature is the encoder, kept on so the round-trip
# test can write its own fixture rather than commit a video file.
hap-qt = { version = "0.3.0", optional = true }
# BCn decompression. The frames HAP hands over are GPU texture blocks;
# this is what turns them back into pixels until the upload path can
# take them as they are.
texpresso = { version = "2.0", optional = true }
# Tracks ffmpeg's own major version — 9.x is the `pkgs.ffmpeg` the
# flake's nixpkgs pin carries, and the binding will refuse to build
# against a libav* whose major it does not know.
ffmpeg-next = { version = "9", optional = true }

# Live DMX in. Host-only, and this gate is the one the comment in
# `features/dmx/ignition-dmx/Cargo.toml` anticipated: a backend with a
# real cost gets a gate, and "does not build for wasm32 at all" is the
# realest cost there is. `sacn` reaches `socket2`, which fails to
# compile for the browser long before any of our code is reached.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sacn = "0.11.1"
artnet_protocol = "0.4.4"

# WebGPU, not WebGL 2 — and this is not a preference, it is the whole
# renderer. A wasm build of Bevy defaults to the GL backend, and WebGL 2
# reports `max_storage_buffers_per_shader_stage: 0`: no storage buffers,
# so no clustered forward lighting, and the room renders black on a
# machine whose browser had WebGPU available the whole time. Bevy's own
# feature says it best — turning this on in a wasm build turns WebGL 2
# support off, which is exactly what is wanted here.
#
# Features are additive, so the `x11`/`wayland`/`multi_threaded` set the
# workspace asks for comes along and is ignored for this target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["webgpu"] }

# The one visualizer binary — windowed by default, `--snapshot <path>` to
# render a single frame headlessly. Replaces the pre-Bevy pair of `shot`
# (static venue) and `live` (live DMX), which were two binaries only
# because they were two hand-written wgpu pipelines.
[[bin]]
name = "viz"
path = "src/bin/viz.rs"

[lints]
workspace = true
