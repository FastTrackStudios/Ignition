[package]
name = "ignition"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Ignition: run a night of lighting cues against a Live set's playhead, in the 3D room and out to the rig over sACN / Art-Net"

# The show runner. It reads a night (`.ig-show`) whose songs are songs of
# one Ableton Live set, follows the set's playhead — Ableton's MIDI beat
# clock, or its own clock started by the operator — and plays each song's
# cue list in the visualizer, which sends the rig its DMX.
[features]
default = ["midi-clock"]
midi-clock = ["ignition-daw/midi-clock"]

[dependencies]
ignition-core.workspace = true
ignition-daw = { workspace = true, features = ["ableton"] }
ignition-viz.workspace = true
utils.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Following a Studio engine's transport over its socket.
daw-control.workspace = true
vox.workspace = true
vox-stream.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "signal", "sync", "macros"] }
# Following a session's transport (`--clock session:…`, src/session_clock.rs):
# its host's presence and clock over vox, as the Lighting pane follows it.
session = { workspace = true, features = ["architect", "sync"] }
crdt = { git = "https://github.com/FastTrackStudios/architect", rev = "eaa969f150b4c558b4722c09e7cf619d9fa4bede", features = ["vox"] }
architect = { git = "https://github.com/FastTrackStudios/architect", rev = "eaa969f150b4c558b4722c09e7cf619d9fa4bede", features = ["vox", "connect"] }
uuid.workspace = true
# The visualizer as an Architect process view (`--process-view`): the
# wire, its socket and the frames' memory. `guest` is the program's side
# of sharing frames on the GPU (`gpu::export_texture`, a dma-buf on
# Linux; `gpu::export_surface`, an IOSurface on macOS), on the same wgpu
# as Bevy's device: it is that feature's wgpu types the frames' code
# names, so a second wgpu in the graph is a build error here, not a
# slower transport.
architect-process-view = { workspace = true, features = ["guest"] }
# The wire's own `ViewInput` and `ThemeTokens`: the root manifest's
# pin, one revision for every Architect crate.
architect-workspace.workspace = true
# `kill(pid, 0)`: whether Studio's engine is alive (studio_clock.rs).
rustix = { version = "1", features = ["process"] }
wgpu.workspace = true
bevy.workspace = true

[dev-dependencies]
tempfile = "3"
ableton.workspace = true

[lints]
workspace = true
