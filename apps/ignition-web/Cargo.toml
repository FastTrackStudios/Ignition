[package]
name = "ignition-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "ignition.fasttrackstudio.app — the Ignition landing page and guide"

# The public site: one landing screen and a guide, and nothing else. It
# links to the source and it plays a real render of the visualizer; it
# does not talk to a desk, so it takes no domain crate. Built with
# `just site`.

[dependencies]
# `launch` sits on the base dep rather than a platform feature because
# both halves of a fullstack build go through `LaunchBuilder` — the
# browser one to mount, the server one to render for `dx build --ssg`.
#
# `fullstack` is deliberately NOT here; it belongs to the `server`
# feature alone. See the note there.
dioxus = { workspace = true, features = ["launch", "router"] }

# Direct, only so the `web` feature can turn on `hydrate` — the client
# half of static generation, which adopts the pre-rendered DOM instead of
# throwing it away and re-rendering.
dioxus-web = { workspace = true, optional = true }

# The guide, as a static site. `ssg-build` renders the vault to HTML in
# build.rs; `ssg` is the page model it codegens. The components are this
# crate's own — the guide page here delegates clicks inside the rendered
# note so a wikilink navigates in place — so `ssg-ui` is not taken.
ssg = { workspace = true, default-features = false }

# The guide's knowledge graph. Pure and FS-free by design, so the same
# builder that draws Task's wiki natively builds this one in the browser
# from the notes compiled in by build.rs.
view-knowledge-graph = { workspace = true }
wasm-bindgen = "0.2"
# Not called from this crate. `dioxus-web`'s history stack reads
# `window.location()`, and web-sys gates every DOM type behind a feature
# — features are unified across the graph, so *some* crate has to turn
# them on and dioxus-web does not turn on its own. Without this the
# router fails to build with "no method named `location`".
# `Element` and `MouseEvent` are this crate's own: a wikilink inside the
# rendered note is an ordinary anchor, and the click is caught by walking
# up from the event target to it (see `routes::guide_page`).
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "History",
    "Document",
    "Element",
    "EventTarget",
    "MouseEvent",
    # The hero clip mutes and starts ITSELF — see `routes::home`, where
    # the attribute alone is not enough.
    "HtmlMediaElement",
] }

[build-dependencies]
# The guide is markdown under `docs/guides/`, rendered to HTML at build
# time rather than in the browser: the pages never change after a build,
# so shipping a markdown parser to every visitor buys nothing. The whole
# build script is one call to this.
ssg-build = { workspace = true }

[[bin]]
name = "ignition-web"
path = "src/main.rs"

[features]
default = ["web"]
# `dioxus-web/hydrate` rather than `dioxus/fullstack`, which is the usual
# way to turn it on. Fullstack carries the server-function *client*
# transport — reqwest 0.12 — and this tree already has 0.13 through iroh;
# two reqwest majors in one wasm binary is a hundred `duplicate symbol:
# intounderlyingsource_*` errors out of rust-lld. The site calls no
# server functions from the browser.
web = ["dioxus/web", "dep:dioxus-web", "dioxus-web/hydrate"]
# The server half, which exists only for the length of
# `dx build --ssg` — dx enables it for the server target by name, never
# for the wasm one. reqwest 0.12 arriving here is harmless: this half is
# a host binary.
server = ["dioxus/server", "dioxus/fullstack"]

[lints]
workspace = true
