<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232327"/>
      <stop offset="0.55" stop-color="#151517"/>
      <stop offset="1" stop-color="#0A0A0C"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#FF8A2B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF8A2B" stop-opacity="0"/>
    </radialGradient>
    <!-- userSpaceOnUse, NOT objectBoundingBox: one light direction shared by
         every element, and — the reason it is mandatory — a horizontal line
         has a zero-height bbox, and SVG does not render an
         objectBoundingBox gradient on a zero-extent box at all. That is
         what made Keyflow's staff lines disappear entirely. -->
    <linearGradient id="body" gradientUnits="userSpaceOnUse"
                    x1="180" y1="200" x2="860" y2="880">
      <stop offset="0" stop-color="#FFD3A8"/>
      <stop offset="0.42" stop-color="#FF8A2B"/>
      <stop offset="1" stop-color="#BC4407"/>
    </linearGradient>
    <linearGradient id="spec" gradientUnits="userSpaceOnUse"
                    x1="0" y1="250" x2="0" y2="790">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.60"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD3A8" stop-opacity="0.80"/>
      <stop offset="0.30" stop-color="#FF8A2B" stop-opacity="0.34"/>
      <stop offset="0.78" stop-color="#FF8A2B" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FF8A2B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD3A8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FF8A2B" stop-opacity="0"/>
    </linearGradient>
    <filter id="halo" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#plate)"/>
  <rect width="1024" height="1024" fill="url(#ambient)"/>

  <g filter="url(#halo)" opacity="0.85">
      <path d="M 426 198 H 598 A 26 26 0 0 1 624 224 V 276 A 26 26 0 0 1 598 302 H 426 A 26 26 0 0 1 400 276 V 224 A 26 26 0 0 1 426 198 Z" fill="#FF8A2B"  />
  </g>
  <g>
      <path d="M 426 198 H 598 A 26 26 0 0 1 624 224 V 276 A 26 26 0 0 1 598 302 H 426 A 26 26 0 0 1 400 276 V 224 A 26 26 0 0 1 426 198 Z" fill="url(#body)"  />
      <path d="M 418 302 L 606 302 L 828 862 L 196 862 Z" fill="url(#beam)"/>
      <path d="M 418 302 L 196 862" stroke="url(#edge)" stroke-width="15" stroke-linecap="round" fill="none"/>
      <path d="M 606 302 L 828 862" stroke="url(#edge)" stroke-width="15" stroke-linecap="round" fill="none"/>
      <ellipse cx="512" cy="304" rx="92" ry="19" fill="#FFD3A8" opacity="0.95" filter="url(#soft)"/>
  </g>
  <g>
      <path d="M 426 198 H 598 A 26 26 0 0 1 624 224 V 276 A 26 26 0 0 1 598 302 H 426 A 26 26 0 0 1 400 276 V 224 A 26 26 0 0 1 426 198 Z" fill="url(#spec)"  />
  </g>
</svg>
