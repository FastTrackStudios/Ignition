# Fast prototyping belongs in tests, so the panic lints
# (`[workspace.lints.clippy]` in Cargo.toml) are lifted there and only
# there. A `#[test]` that unwraps a fixture it just built is stating an
# assertion; the same line in `src/` is a way for a show to stop.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Names that are spelled with inner capitals because that is how they are
# spelled, not because they are code: `doc_markdown` would otherwise ask
# for backticks around a company, a console or a protocol every time one
# is named in prose. `..` keeps clippy's own default list.
doc-valid-idents = [
    "..",
    "FastTrackStudio",
    "grandMA2", "grandMA3", "MAtricks",
    "ChamSys", "MagicQ",
    "DaVinci",
    "OpenGL", "WebGPU", "WebSocket",
    "SlimPAR", "RockStrip",
    "MAgic",
    "DejaVu",
]
